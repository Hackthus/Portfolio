<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="WebSpider - Advanced Web Recon Tool">

  <!-- Background -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f14"></stop>
      <stop offset="50%" stop-color="#13202a"></stop>
      <stop offset="100%" stop-color="#1b3a2f"></stop>
    </linearGradient>

    <!-- Glow for spider -->
    <filter id="strongGlow">
      <feGaussianBlur stdDeviation="6" result="blur"></feGaussianBlur>
      <feMerge>
        <feMergeNode in="blur"></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"></rect>

  <!-- Spider web (left, background) -->
  <g transform="translate(220 160)" stroke="#1aff64" stroke-opacity="0.12" stroke-width="1.3" fill="none">

    <!-- Radials -->
    <line x1="0" y1="0" x2="0" y2="-160"></line>
    <line x1="0" y1="0" x2="140" y2="-80"></line>
    <line x1="0" y1="0" x2="160" y2="0"></line>
    <line x1="0" y1="0" x2="140" y2="80"></line>
    <line x1="0" y1="0" x2="0" y2="160"></line>
    <line x1="0" y1="0" x2="-140" y2="80"></line>
    <line x1="0" y1="0" x2="-160" y2="0"></line>
    <line x1="0" y1="0" x2="-140" y2="-80"></line>

    <!-- Rings -->
    <polygon points="0,-50 45,-25 50,0 45,25 0,50 -45,25 -50,0 -45,-25"></polygon>
    <polygon points="0,-100 90,-50 100,0 90,50 0,100 -90,50 -100,0 -90,-50"></polygon>
    <polygon points="0,-150 135,-75 150,0 135,75 0,150 -135,75 -150,0 -135,-75"></polygon>
  </g>

  <!-- Spider (XXL & pro) -->
  <g transform="translate(220 160)" filter="url(#strongGlow)">
    <!-- Body -->
    <ellipse cx="0" cy="15" rx="28" ry="30" fill="#1aff64"></ellipse>
    <ellipse cx="0" cy="-28" rx="20" ry="22" fill="#1aff64"></ellipse>

    <!-- Legs -->
    <g stroke="#1aff64" stroke-width="4" stroke-linecap="round">
      <path d="M -25 -12 C -60 -28, -85 -45, -115 -65"></path>
      <path d="M -28  5 C -65   8, -90  -5, -120 -20"></path>
      <path d="M -28  20 C -65  35, -90  55, -120  80"></path>
      <path d="M -25  35 C -60  65, -85  85, -115 105"></path>

      <path d="M  25 -12 C  60 -28,  85 -45,  115 -65"></path>
      <path d="M  28  5 C  65   8,  90  -5,  120 -20"></path>
      <path d="M  28  20 C  65  35,  90  55,  120  80"></path>
      <path d="M  25  35 C  60  65,  85  85,  115 105"></path>
    </g>
  </g>

  <!-- Title (green) -->
  <text x="650" y="145" font-family="JetBrains Mono, Consolas, monospace" font-size="70" font-weight="700" fill="#1aff64" letter-spacing="6">
    WEBSPIDER
  </text>

  <!-- Subtitle -->
  <text x="650" y="190" font-family="JetBrains Mono, Consolas, monospace" font-size="22" fill="#c8facc" opacity="0.9">
    Advanced Web Recon &amp; Crawling Tool
  </text>

  <!-- Footer -->
  <text x="1180" y="300" text-anchor="end" font-family="JetBrains Mono, Consolas, monospace" font-size="14" fill="#8affc1" opacity="0.6">
    Recon • Crawling • Pentest
  </text>

</svg>
